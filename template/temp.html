    <meta name="description" content="A brief description of your webpage.">

<body>   
    <main>
        <div class = "index-section">
            <p style = "padding: 0.2em 2em; font-weight: bold; font-size: 20px; text-align: center;"><a href = "/" class = "home-index">WIZio-RTU</a></p>
            <hr style="border: 1px; border-style: solid; border-color: #293649;">
            <div class = "index-catalog">
                <a href = "/netconfig" class = "index-item"><i>🌐</i>Network<br>Configuration</a>
                <a href = "/io" class = "index-item"><i>⚡</i>I/O Control</a>
                <a href = "/analog_io" class = "index-item"><i>📈</i>Analog I/O</a>
                <a href = "/serial" class = "index-item"><i>🔌</i>Serial Test</a>
                <a href = "/storage" class = "index-item"><i>💾</i>Storage Test</a>
                <a href = "/load-cell" class = "index-item"><i>⚖️</i>Load cell sensor</a>
                <a href = "/temp" class = "index-item index-chosen"><i>🌡️</i>Thermocouple<br>temperature</a>
            </div>
        </div>
        </div>
        <div class = "main-content">       
            <h2 class="page-title">Thermocouple Temperature Monitoring</h2>
            <div>
               <div class="channel-box">
                    <div class="channel-header">
                        <div class="channel-name">K1 Channel</div>
                        <span id="thermocouple-value-k1" class="temp-value">18.0 °C</span>
                    </div>
                    <div class="progress-bg">
                        <div id="thermocouple-progress-k1" class="progress-fill" style="width: 1.38462%;"></div>
                    </div>
                    <div class="scale-info">
                        <span>0°C</span>
                        <span>650°C</span>
                        <span>1300°C</span>
                    </div>
                </div>
                <div class="channel-box">
                    <div class="channel-header">
                        <div class="channel-name">K2 Channel</div>
                        <span id="thermocouple-value-k2" class="temp-value">18.0 °C</span>
                    </div>
                    <div class="progress-bg">
                        <div id="thermocouple-progress-k2" class="progress-fill" style="width: 1.38462%;"></div>
                    </div>
                    <div class="scale-info">
                        <span>0°C</span>
                        <span>650°C</span>
                        <span>1300°C</span>
                    </div>
                </div>
            </div>
            <footer style = "font-size: small;">

            </footer>
